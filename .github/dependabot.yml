version: 2

# Grouping policy (Decision 86)
#
# Before: ~10 individual PRs a week. Combined with the advisory gates in
# test.yml -- which run `npm audit` / `dotnet list package --vulnerable`
# against LIVE feeds before build+test, and feed the required `test-summary`
# check -- a one-package-per-PR queue can deadlock: the gate demands every
# advisory be clear at once, so no single-package PR can ever go green while
# any other advisory is outstanding. That is what stalled 27 PRs behind
# 75 alerts (see Decision 83).
#
# Each ecosystem now emits at most three PRs per cycle:
#   *-security     -- ALL security updates, grouped. This is the important
#                     one: a single PR can clear the whole advisory backlog
#                     at once, which is exactly what a simultaneous-clear
#                     gate requires.
#   *-production    -- runtime dependency version updates
#   *-development   -- tooling/test dependency version updates
#
# Every `ignore` rule below is carried over unchanged -- they encode prior
# decisions (Decisions 35, 69, 71) and are deliberately NOT relaxed here.
updates:
  # Frontend npm (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # All security updates in one PR, so the advisory gates can go green
      # in a single merge instead of never.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # react/react-dom must share an exact version; both are production
      # deps, so this group keeps them in lockstep automatically.
      npm-production:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # tailwindcss v4 is a breaking rewrite — defer to Phase 8
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint v10 has breaking plugin changes — defer to Phase 8
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # next-auth v5 is intentionally on beta — don't auto-bump to v4 stable
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 is a major — defer to Phase 8 per Decision 35
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # lucide-react v1 dropped all brand icons (Github, LinkedIn, etc.) — see Decision 69
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  # CMS npm (cms/)
  - package-ecosystem: "npm"
    directory: "/cms"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      cms-security:
        applies-to: security-updates
        patterns:
          - "*"
      cms-production:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      cms-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # Strapi controls its React version — don't auto-bump
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Strapi controls react-router-dom — don't auto-bump
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 is a major — defer to Phase 8 per Decision 35
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # .NET NuGet (backend/)
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
      # EF Core requires matching versions across its packages in one app,
      # and the ASP.NET Core servicing line moves in lockstep with it, so a
      # single group keeps the whole 10.0.x surface aligned in one PR.
      nuget-all:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.*"
        update-types: ["version-update:semver-major"]
      # Swashbuckle v10 is a major — defer per Decision 35
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker — frontend
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      docker-frontend:
        patterns:
          - "*"
    ignore:
      # Node 25 is odd-numbered STS (non-LTS); target is Node 22 LTS when ready
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker — backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      docker-backend:
        patterns:
          - "*"
    ignore:
      # .NET 10 LTS runs until Nov 2028; major-version bumps are deferred here
      # because the next LTS is .NET 12 (odd releases, e.g. .NET 11, are STS).
      # Dependabot names MCR images WITHOUT the registry host ("dotnet/sdk",
      # not "mcr.microsoft.com/dotnet/sdk") — the old host-qualified names
      # never matched, which let PRs #119 and #148 through (Decision 88).
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  # Docker — CMS
  - package-ecosystem: "docker"
    directory: "/cms"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      docker-cms:
        patterns:
          - "*"
    ignore:
      # Node 25 is odd-numbered STS (non-LTS); target is Node 22 LTS when ready
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
